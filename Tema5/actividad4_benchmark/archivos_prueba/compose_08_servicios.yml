version: '3.8'

services:
  servicio_01:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "10087:80"
    environment:
      - APP_ENV=production
      - SERVICE_ID=1
      - LOG_LEVEL=info

  servicio_02:
    image: node:18-alpine
    restart: unless-stopped
    ports:
      - "10119:443"
    environment:
      - APP_ENV=production
      - SERVICE_ID=2
      - LOG_LEVEL=info

  servicio_03:
    image: python:3.11-slim
    restart: unless-stopped
    ports:
      - "10254:3000"
    environment:
      - APP_ENV=production
      - SERVICE_ID=3
      - LOG_LEVEL=info

  servicio_04:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "10328:3306"
    environment:
      - APP_ENV=production
      - SERVICE_ID=4
      - LOG_LEVEL=info
    depends_on:
      - servicio_02

  servicio_05:
    image: redis:7
    restart: unless-stopped
    ports:
      - "10452:5432"
    environment:
      - APP_ENV=production
      - SERVICE_ID=5
      - LOG_LEVEL=info

  servicio_06:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "10516:5672"
    environment:
      - APP_ENV=production
      - SERVICE_ID=6
      - LOG_LEVEL=info

  servicio_07:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "10633:6379"
    environment:
      - APP_ENV=production
      - SERVICE_ID=7
      - LOG_LEVEL=info
    depends_on:
      - servicio_05

  servicio_08:
    image: elasticsearch:8.5.0
    restart: unless-stopped
    ports:
      - "10749:8080"
    environment:
      - APP_ENV=production
      - SERVICE_ID=8
      - LOG_LEVEL=info

networks:
  red_principal:
    driver: bridge

volumes:
  datos_persistentes:
    driver: local
